<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Taglie | Bicycle Line</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{font-family:Inter,Arial,sans-serif;color:#192536;background:#f3f5f8}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{background:#fff;border-bottom:1px solid #e4e8ef;padding:17px max(20px,calc((100vw - 920px)/2));display:flex;align-items:center;gap:15px}header img{width:70px;object-fit:contain}main{max-width:920px;margin:30px auto;padding:0 17px}.card{background:#fff;border:1px solid #e4e8ef;box-shadow:0 5px 25px #10203008;border-radius:13px;padding:23px;margin-bottom:18px}h1{font-size:27px;margin:0 0 8px}h2{font-size:17px;margin:0 0 15px}.muted{color:#677588;font-size:13px;line-height:1.6}label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px}input,select{width:100%;border:1px solid #cdd6e0;border-radius:8px;padding:12px;font:inherit;background:#fff;min-width:0}input:focus,select:focus{outline:2px solid #bd1f40;outline-offset:1px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.sizes{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;margin-top:14px}.sizes label{text-align:center;font-size:12px}.sizes input{text-align:center;padding:9px 2px}.actions{display:flex;gap:9px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}button{background:#a3263b;color:white;border:0;padding:13px 18px;border-radius:8px;font:600 13px Inter;cursor:pointer}button.secondary{background:#ecf0f4;color:#273546}button:disabled{opacity:.6;cursor:default}.productphoto{width:100px;height:110px;object-fit:contain;background:#fff;border:1px solid #e4e8ef;border-radius:8px;padding:5px}.productoverview{display:flex;align-items:center;gap:14px;margin:10px 0}.product{padding:19px;border:1px solid #e2e7ef;border-radius:10px;margin:14px 0}.producthead{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:12px;color:#a3263b;font-weight:bold}#notice{color:#a3263b}.total{text-align:right;font-weight:700;margin-top:15px}.count{font-size:13px;margin-top:4px;color:#677588}.count.ok{color:#23824c}.count.ko b:first-child{color:#a3263b}@media(max-width:650px){.grid{grid-template-columns:1fr}.sizes{grid-template-columns:repeat(4,1fr)}.card{padding:15px}h1{font-size:22px}}</style></head><body><header><img src="img/brand/bl-logo.png" alt="Bicycle Line"><strong>Raccolta taglie</strong></header><main><div class="card"><h1 id="team">Caricamento...</h1><p class="muted">Qui sotto trovi i prodotti del vostro preventivo: indica quanti pezzi servono per ciascuna taglia. Puoi salvare una bozza e tornare a compilare questo modulo prima della conferma definitiva.</p><p id="notice" role="status"></p></div><section class="card" id="formcard" hidden><h2>Prodotti e taglie</h2><div id="products"></div><button id="add" type="button" class="secondary">+ Aggiungi prodotto</button><div id="total" class="total"></div><div class="actions"><button type="button" id="draft" class="secondary">Salva bozza</button><button type="button" id="submit">Conferma taglie definitive</button></div></section></main><script src="js/img-fallback.js?v=15"></script><script src="js/taglie-images.js"></script><script src="js/config.js"></script><script src="vendor/supabase.min.js"></script><script>
(async()=>{'use strict';const qs=new URLSearchParams(location.search),token=qs.get('t'),config=window.BL_CONFIG;
const notice=document.getElementById('notice'),container=document.getElementById('products'),team=document.getElementById('team');let lines=[],locked=false,preselected=false;
const sizes=['3XS','XXS','XS','S','M','L','XL','XXL','3XL','4XL','5XL','6XL'];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function newLine(){return {sku:'',product:'',gender:'Unisex',sizes:{}};}
function draw(){container.innerHTML=lines.map((l,i)=>`<article class="product" data-index="${i}"><div class="producthead"><span class="tag">PRODOTTO ${i+1}</span>${!locked&&!preselected?`<button type="button" class="secondary remove" data-i="${i}">Rimuovi</button>`:''}</div><div class="grid" ${preselected?'hidden':''}><div><label>Codice prodotto</label><input class="sku" maxlength="80" value="${esc(l.sku)}" placeholder="es. W7014" ${locked?'disabled':''}></div><div><label>Nome prodotto</label><input class="productname" maxlength="160" value="${esc(l.product)}" placeholder="es. Maglia Triathlon" ${locked?'disabled':''}></div><div><label>Versione</label><select class="gender" ${locked?'disabled':''}>${['Unisex','Uomo','Donna','Bambino','Bambina'].map(g=>`<option ${g===l.gender?'selected':''}>${g}</option>`).join('')}</select></div></div><div class="productoverview">${(window.BLTagliePhotos||{})[String(l.sku||'').toUpperCase()]?`<img class="productphoto" src="${esc(window.BLTagliePhotos[String(l.sku||'').toUpperCase()])}" alt="Foto ${esc(l.product)}">`: ''}<div><div style="font-weight:700">${esc(l.product)}${l.model?` · ${esc(l.model)}`:''}</div>${preselected?`<div class="muted">${esc(l.sku)} · ${esc(l.gender)}${l.note?` · ${esc(l.note)}`:''}</div><div class="count" data-count="${i}">Pezzi da distribuire: <b>${Number(l.expected)||0}</b></div>`:''}</div></div><div class="sizes">${sizes.map(s=>`<label>${s}<input class="qty" data-size="${s}" type="number" inputmode="numeric" min="0" max="10000" step="1" value="${Number(l.sizes?.[s])||0}" ${locked?'disabled':''}></label>`).join('')}</div></article>`).join('');document.getElementById('add').hidden=locked||preselected;document.getElementById('draft').hidden=locked;document.getElementById('submit').hidden=locked;updateTotal();}
function collect(){lines=[...container.querySelectorAll('.product')].map(el=>{const original=lines[Number(el.dataset.index)]||newLine();return {...original,sku:el.querySelector('.sku')?.value.trim()??original.sku,product:el.querySelector('.productname')?.value.trim()??original.product,gender:el.querySelector('.gender')?.value??original.gender,...(original.expected!=null?{expected:original.expected}:{}),sizes:Object.fromEntries([...el.querySelectorAll('.qty')].map(e=>[e.dataset.size,Number(e.value)||0]))};});}
function updateTotal(){let sum=0,exp=0;container.querySelectorAll('.product').forEach(el=>{const l=lines[Number(el.dataset.index)]||{};let s=0;el.querySelectorAll('.qty').forEach(x=>s+=Math.max(0,Number(x.value)||0));sum+=s;const c=el.querySelector('.count');if(c&&l.expected!=null){exp+=Number(l.expected)||0;const ok=s===Number(l.expected);c.className='count '+(ok?'ok':'ko');c.innerHTML='Inseriti <b>'+s+'</b> su <b>'+(Number(l.expected)||0)+'</b> pezzi'+(ok?' ✓':'');}});document.getElementById('total').textContent='Totale pezzi: '+sum+(preselected?' / '+exp:'');}
container.addEventListener('input',updateTotal);container.addEventListener('click',e=>{if(e.target.classList.contains('remove')){collect();lines.splice(Number(e.target.dataset.i),1);draw();}});
document.getElementById('add').onclick=()=>{collect();lines.push(newLine());draw();};
if(!/^[0-9a-f]{8}-[0-9a-f-]{27,36}$/i.test(token||'')){team.textContent='Link non valido';return;}
if(!config?.supabaseUrl||!config?.supabaseAnonKey){team.textContent='Configurazione incompleta';return;}
const db=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw Error(error.message);return data;}
try{const data=await rpc('bl_sizes_public_get',{p_token:token});team.textContent=data.team||'Ordine Bicycle Line';lines=Array.isArray(data.lines)?data.lines:[];locked=data.status==='ricevuto';preselected=lines.some(l=>l.expected!=null);if(!lines.length&&!locked)lines=[newLine()];if(!preselected&&!locked){notice.textContent='Nessun prodotto collegato a questa richiesta. Apri PREVENTIVO nel CRM, aggiungi gli articoli e premi Salva nella task. Se li hai già salvati, controlla lo script 04 in Supabase.';}document.getElementById('formcard').hidden=!preselected&&!locked;draw();if(locked)notice.textContent='Taglie confermate. Per apportare modifiche contatta Bicycle Line.';}catch(e){team.textContent='Impossibile aprire il modulo';notice.textContent=e.message;}
async function save(submit){try{if(!preselected)throw Error('Non puoi compilare taglie prima di salvare un preventivo collegato alla task.');collect();for(const l of lines){if(!l.product&&!l.sku)throw Error('Inserisci un nome o codice per ciascun prodotto.');for(const n of Object.values(l.sizes))if(!Number.isInteger(n)||n<0||n>10000)throw Error('Controlla le quantità inserite.');}if(submit&&preselected){for(const l of lines){const sum=Object.values(l.sizes).reduce((a,b)=>a+Number(b||0),0);if(sum!==Number(l.expected))throw Error('Per '+l.product+' devi distribuire esattamente '+l.expected+' pezzi (attuali '+sum+').');}}if(submit&&!confirm('Confermare definitivamente tutte le taglie? Dopo l’invio non potranno essere modificate senza riapertura da Bicycle Line.'))return;const b=document.getElementById('draft'),s=document.getElementById('submit');b.disabled=s.disabled=true;const d=await rpc('bl_sizes_public_save',{p_token:token,p_lines:lines,p_submit:submit});locked=d.status==='ricevuto';notice.style.color='#23824c';notice.textContent=locked?'Taglie confermate e inviate a Bicycle Line.':'Bozza salvata correttamente.';if(locked)draw();b.disabled=s.disabled=false;}catch(e){notice.style.color='#a3263b';notice.textContent=e.message;document.getElementById('draft').disabled=document.getElementById('submit').disabled=false;}}
document.getElementById('draft').onclick=()=>save(false);document.getElementById('submit').onclick=()=>save(true);
})();</script></body></html>
